- name: Item 51 calibration decision criterion
  current_value: At frozen TM 0.50, an in-cohort calibration satisfies the Item 48
    calibration condition if a low-confidence ESMFold member (<0.50 mean pLDDT) and
    at least one confident member (>=0.50) share a frozen MMseqs2 30%-identity sequence
    cluster, and the two-sided 95% Wilson upper bound on the resulting false-singleton
    rate is below 150/175 = 0.8571. The rate is a direct same-cohort measurement and
    needs no distribution-match or external-family transfer. It measures failure to
