- name: Item 61 in-cohort sequence-relative calibration label
  current_value: 'Admissible calibration family label: membership in the frozen MMseqs2
    30%-identity sequence cluster. Eligible low-confidence ESMFold members (<0.50
    mean pLDDT) require at least one >=0.50 member in that same cluster. This is a
    direct in-cohort measurement, not an external-family transfer. Sequence clusters
    are narrower than structural families, and a sequence relative is easier to join;
    the false-singleton rate is therefore biased downward in the direction favouring
    continuation. Every downstream corrected rate, clusters, panels_max, MDE and Item-48
    statement must carry that bias.'
  set_on: '2026-09-16'
  set_by: Referee
  amendment_rule: Frozen before the in-cohort Foldseek measurement. Amend only with
    a retained demonstration that the ruled sequence relation is not predictor-independent.
  amendments:
  - date: '2026-09-16'
    by: Referee
    reason: 'Item 61 verified the cohort recount at 59 multi-member clusters, seven
      mixed-confidence clusters and nine eligible low-confidence members. The external
      route is structurally infeasible rather than merely inconvenient: induced uncertainty
      left lysozyme, ubiquitin and RNase A above 0.89 pLDDT; official ECOD was unreachable
      from an allowlisted Fetcher (curl exit 7); and SCOP/PDBe yielded one target-band
      coronavirus nucleocapsid member in 34 predictions, without qualifying family
      support. Frozen sequence identity establishes relatedness independently of the
      structure predictor and is the only available direct test.'
    previous_value: null
    new_value: 'Admissible calibration family label: membership in the frozen MMseqs2
