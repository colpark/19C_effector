version: 1
threats:
  - id: T1
    enforced_by: platform
    definition: "Execution outside the cell sandbox"
    why_it_matters: "Standard platform protection. Do not duplicate it in a gate"
  - id: T2
    enforced_by: platform
    definition: "Network reach beyond the allowlist"
    why_it_matters: "An arm fetching a PHI-base record live bypasses the frozen cohort"
  - id: T3
    enforced_by: platform
    definition: "Package install at run time"
    why_it_matters: "Changes the tool surface mid-run and invalidates the card"
  - id: T4
    enforced_by: platform
    definition: "Filesystem write outside cell scratch"
    why_it_matters: "Cross-cell contamination through shared state"
  - id: T5
    enforced_by: project
    definition: "Grant violation, meaning an arm reaching a capability its condition withholds"
    why_it_matters: "Arm 3 touching a foundation model endpoint destroys the only comparison the benchmark exists to make"
  - id: T6
    enforced_by: project
    definition: "Label leakage, meaning any read of an item's own evidence record or of the answer key"
    why_it_matters: "The dominant domain threat. Positives carry their own PHI-base entries, which state the assay"
  - id: T7
    enforced_by: project
    definition: "Cross-cell memory persisting between cells of one run"
    why_it_matters: "Persistent agent memory is a contamination channel. Disable it and verify from the model's side"
  - id: T8
    enforced_by: project
    definition: "Scorer contact by any arm"
    why_it_matters: "A tool that helps produce an answer must not score it"
